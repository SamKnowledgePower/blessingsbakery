<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理入口｜Blessings Bakery</title><link rel="stylesheet" href="styles.css"></head><body><div data-nav></div><header class="pagehero"><div class="wrap"><div class="eyebrow">Private Admin</div><h1>專案進度管理入口</h1><p class="lede">此頁為後續串接 Supabase 的管理介面母版；公開客戶頁為 progress.html。</p></div></header><main><section><div class="wrap"><div class="callout"><b>目前狀態：</b>介面與資料欄位已定義，尚未連接登入與資料庫，因此按鈕不會發布資料，避免製造假更新。</div><form class="admin-form" onsubmit="event.preventDefault();document.querySelector('#notice').textContent='尚未連接 Supabase，資料未送出。';"><label class="field">專案<select><option>Blessings Bakery</option></select></label><label class="field">月份<select><option>M0｜2026/09</option><option>M1｜2026/10</option><option>M2｜2026/11</option><option>M3｜2026/12</option></select></label><label class="field">狀態<select><option>尚未啟動</option><option>進行中</option><option>待客戶確認</option><option>已完成</option></select></label><label class="field">本週完成內容<textarea placeholder="逐項說明本週完成內容"></textarea></label><label class="field">成果連結<input type="url" placeholder="https://"></label><label class="field">連結按鈕名稱<input placeholder="例如：查看第一版腳本"></label><label class="field">下一步<textarea placeholder="下一週預計推進事項"></textarea></label><button class="btn" type="submit">發布更新</button><p class="note" id="notice">正式串接前，本頁不會寫入任何資料。</p></form></div></section></main><div data-footer></div><script src="site.js"></script></body></html>
